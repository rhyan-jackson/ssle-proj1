apiVersion: v1
kind: ServiceAccount
metadata:
  name: action-response
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: action-response
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: action-response
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: action-response
subjects:
  - kind: ServiceAccount
    name: action-response
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: action-response
  labels:
    app: action-response
spec:
  replicas: 1
  selector:
    matchLabels:
      app: action-response
  template:
    metadata:
      labels:
        app: action-response
    spec:
      serviceAccountName: action-response
      nodeSelector:
        role: worker
      containers:
        - name: action-response
          image: 10.255.255.44:5000/action-response:v1
          env:
            - name: ACTION
              value: netpol
            - name: NAMESPACE
              value: default
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: action-response
  labels:
    app: action-response
spec:
  selector:
    app: action-response
  ports:
    - name: http
      port: 8080
      targetPort: 8080
