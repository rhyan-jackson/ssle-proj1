apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
    spec:
      nodeSelector:
        role: worker
      containers:
        - name: storage
          image: 10.255.255.44:5000/storage:v5
          ports:
            - containerPort: 5002
              name: metrics
          env:
            - name: REGISTRY_URL
              value: "http://registry:5050"
            - name: SELF_URL
              value: "http://storage:5002"
            - name: DB_PATH
              value: "/data/temp_data.db"
            - name: TEMP_MIN
              value: "-50"
            - name: TEMP_MAX
              value: "60"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: storage-data
---
apiVersion: v1
kind: Service
metadata:
  name: storage
spec:
  selector:
    app: storage
  ports:
    - port: 5002
      targetPort: 5002
