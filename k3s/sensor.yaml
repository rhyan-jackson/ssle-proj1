apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sensor
  template:
    metadata:
      labels:
        app: sensor
    spec:
      nodeSelector:
        role: worker
      containers:
        - name: sensor
          image: 10.255.255.44:5000/sensor:v4
          ports:
            - containerPort: 9100
              name: metrics
          env:
            - name: REGISTRY_URL
              value: "http://registry:5050"
            - name: DEVICE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SELF_URL
              value: "http://sensor:9100"
            - name: INTERVAL
              value: "5"
            - name: METRICS_PORT
              value: "9100"
