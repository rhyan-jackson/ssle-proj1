apiVersion: v1
kind: Service
metadata:
  name: sensor-headless
  labels:
    app: sensor
spec:
  clusterIP: None
  selector:
    app: sensor
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sensor
spec:
  serviceName: sensor-headless
  replicas: 3
  selector:
    matchLabels:
      app: sensor
  template:
    metadata:
      labels:
        app: sensor
    spec:
      nodeSelector:
        role: worker
      containers:
        - name: sensor
          image: 10.255.255.44:5000/sensor:v5
          ports:
            - containerPort: 9100
              name: metrics
          env:
            - name: REGISTRY_URL
              value: "http://registry:5050"
            - name: SITE
              value: "ua"
            - name: ZONE
              value: "lab"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SELF_URL
              value: "http://$(POD_NAME).sensor-headless:9100"
            - name: INTERVAL
              value: "5"
            - name: METRICS_PORT
              value: "9100"
