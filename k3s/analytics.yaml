apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      nodeSelector:
        role: worker
      containers:
        - name: analytics
          image: 10.255.255.44:5000/analytics:v4
          ports:
            - containerPort: 5003
              name: metrics
          env:
            - name: REGISTRY_URL
              value: "http://registry:5050"
            - name: SELF_URL
              value: "http://analytics:5003"
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
spec:
  selector:
    app: analytics
  ports:
    - port: 5003
      targetPort: 5003
